<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-label="Asana color system palette">
  <rect width="1200" height="300" rx="20" fill="#FFFFFF" stroke="#F3F3F3"/>
  <text x="60" y="56" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#0D0D0D" letter-spacing="-0.3">Color system</text>
  <text x="60" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#8A949D">Muted, neutral, built to recede behind the work.</text>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <!-- 1 primary -->
    <text x="60" y="122" font-size="12" font-weight="600" fill="#0D0D0D">primary</text>
    <rect x="60" y="132" width="120" height="110" rx="12" fill="#646F79"/>
    <text x="60" y="264" font-size="11" fill="#8A949D">#646F79</text>

    <!-- 2 on-primary -->
    <text x="195" y="122" font-size="12" font-weight="600" fill="#0D0D0D">on-primary</text>
    <rect x="195" y="132" width="120" height="110" rx="12" fill="#FFFFFF" stroke="#E8E8E8"/>
    <text x="195" y="264" font-size="11" fill="#8A949D">#FFFFFF</text>

    <!-- 3 background -->
    <text x="330" y="122" font-size="12" font-weight="600" fill="#0D0D0D">background</text>
    <rect x="330" y="132" width="120" height="110" rx="12" fill="#FFFFFF" stroke="#E8E8E8"/>
    <text x="330" y="264" font-size="11" fill="#8A949D">#FFFFFF</text>

    <!-- 4 surface -->
    <text x="465" y="122" font-size="12" font-weight="600" fill="#0D0D0D">surface</text>
    <rect x="465" y="132" width="120" height="110" rx="12" fill="#0D0D0D"/>
    <text x="465" y="264" font-size="11" fill="#8A949D">#0D0D0D</text>

    <!-- 5 border -->
    <text x="600" y="122" font-size="12" font-weight="600" fill="#0D0D0D">border</text>
    <rect x="600" y="132" width="120" height="110" rx="12" fill="#F3F3F3" stroke="#E8E8E8"/>
    <text x="600" y="264" font-size="11" fill="#8A949D">#F3F3F3</text>

    <!-- 6 text -->
    <text x="735" y="122" font-size="12" font-weight="600" fill="#0D0D0D">text</text>
    <rect x="735" y="132" width="120" height="110" rx="12" fill="#FFFFFF" stroke="#E8E8E8"/>
    <text x="735" y="264" font-size="11" fill="#8A949D">#FFFFFF</text>

    <!-- 7 text-muted -->
    <text x="870" y="122" font-size="12" font-weight="600" fill="#0D0D0D">text-muted</text>
    <rect x="870" y="132" width="120" height="110" rx="12" fill="#0D0D0D"/>
    <text x="870" y="264" font-size="11" fill="#8A949D">#0D0D0D</text>

    <!-- 8 accent -->
    <text x="1005" y="122" font-size="12" font-weight="600" fill="#0D0D0D">accent</text>
    <rect x="1005" y="132" width="120" height="110" rx="12" fill="#0D0E10"/>
    <text x="1005" y="264" font-size="11" fill="#8A949D">#0D0E10</text>
  </g>
</svg>
